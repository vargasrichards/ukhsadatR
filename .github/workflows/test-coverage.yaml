# Measures test coverage with covr and reports it on the run summary page.
# No external service or token is needed.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      UKHSADATR_LIVE_TESTS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP")), "package")
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          by_file <- covr::coverage_to_list(cov)$filecoverage
          lines <- c(
            sprintf("## Test coverage: %.1f%%", pct), "",
            "| File | Coverage |", "|---|---|",
            sprintf("| `%s` | %.1f%% |", names(by_file), by_file)
          )
          writeLines(lines, Sys.getenv("GITHUB_STEP_SUMMARY"))
          covr::to_cobertura(cov, filename = "cobertura.xml")

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: cobertura.xml

      - name: Show testthat output on failure
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
